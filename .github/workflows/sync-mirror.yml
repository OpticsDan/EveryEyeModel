name: Sync mirror from OpticsDan
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'Optoguy/EveryEyeModel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git fetch https://github.com/OpticsDan/EveryEyeModel.git main
          git push origin FETCH_HEAD:refs/heads/main --force
